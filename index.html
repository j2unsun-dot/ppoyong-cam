<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>필름캠</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="필름캠">
<meta name="theme-color" content="#161412">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#161412; --panel:#1f1c19; --text:#f6f1ea; --muted:#a99f93;
  --accent:#e9c48f; --accent2:#d9a27a; --chip:#2b2723;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;height:48px}
.brand{font-weight:700;letter-spacing:.5px;color:var(--accent)}
.top-btns{display:flex;gap:6px}
.pill.hq{color:var(--accent);border:1px solid rgba(233,196,143,.4)}
.pill{padding:6px 11px;border-radius:99px;background:var(--chip);font-size:12px;color:var(--muted);cursor:pointer}
.pill.on{background:var(--accent);color:#3a2a1c}

.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#view{max-width:100%;max-height:100%;aspect-ratio:3/4;width:100%;object-fit:contain;image-rendering:auto;display:block;background:#000;border-radius:4px}
#video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}
.filter-toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:99px;
  background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px;opacity:0;transition:opacity .3s}
.filter-toast.show{opacity:1}
.countdown{position:absolute;font-size:96px;font-weight:200;text-shadow:0 2px 20px rgba(0,0,0,.4);pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.85;transition:none}

.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 25%,#5a4330 0,#1a1613 70%)}
.start[hidden]{display:none}
.start-card{text-align:center;padding:24px}
.start-title{font-size:34px;font-weight:700;color:var(--accent);margin-bottom:6px}
.start p{color:var(--muted);margin:6px 0 22px}
.start .sub{font-size:12px;margin-top:18px;max-width:260px;margin-left:auto;margin-right:auto;line-height:1.5}
.start .msg{font-size:13px;line-height:1.5;margin-top:16px;max-width:280px}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#3a2a1c;font-weight:700;
  padding:14px 28px;border-radius:99px;font-size:16px}
.ghost{background:var(--chip);padding:14px 24px;border-radius:99px;font-size:16px}

.controls{background:var(--panel);padding:10px 0 12px;border-radius:20px 20px 0 0}
.adj-tabs{display:flex;gap:4px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none}
.adj-tabs::-webkit-scrollbar{display:none}
.adj-tabs button{flex:0 0 auto;position:relative;padding:5px 11px;border-radius:99px;font-size:12px;color:var(--muted)}
.adj-tabs button.active{background:var(--chip);color:var(--text)}
.adj-tabs button.changed::after{content:"";position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.reset{width:26px;height:26px;border-radius:50%;background:var(--chip);color:var(--muted);font-size:14px;line-height:26px;padding:0}
.slider-row{display:flex;align-items:center;gap:10px;padding:0 20px 8px;font-size:12px;color:var(--muted)}
.slider-row span:last-child{width:26px;text-align:right}
input[type=range]{flex:1;accent-color:var(--accent);height:24px}
.filters{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 12px;scroll-snap-type:x proximity;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;scroll-snap-align:center;font-size:12px;color:var(--muted)}
.chip .sw{width:54px;height:54px;border-radius:14px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.chip.active{color:var(--text)}
.chip.active .sw{border-color:var(--accent)}
.chip .grp{font-size:9px;opacity:.7;margin-top:-4px}
.shutter-row{display:flex;justify-content:space-around;align-items:center;padding:4px 24px 0}
.round{width:48px;height:48px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center}
.round svg{width:24px;height:24px;fill:none;stroke:var(--text);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--text);padding:4px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#fff,var(--accent));transition:transform .1s}
.shutter:active span{transform:scale(.88)}
.shutter.import span{background:linear-gradient(135deg,var(--accent),var(--accent2))}

.review{position:fixed;inset:0;background:rgba(10,8,6,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 20px);z-index:10}
.review[hidden]{display:none}
.review img{max-width:100%;max-height:72dvh;border-radius:6px;-webkit-user-select:auto;-webkit-touch-callout:default}
.hint{font-size:12px;color:var(--muted);margin:12px 0 16px}
.review-actions{display:flex;gap:12px}

.back{position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:13px;z-index:2}
.back[hidden]{display:none}
.chip .sw{width:54px;height:54px}

.stage{touch-action:none}
.zoom-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:4px;
  border-radius:99px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:2}
.zoom-bar[hidden]{display:none}
.zoom-bar button{min-width:38px;height:38px;border-radius:50%;font-size:12px;color:#eee}
.zoom-bar button.on{background:rgba(0,0,0,.5);color:var(--accent);font-weight:700}

.panel-toggle{display:block;width:100%;height:22px;margin-top:-6px;padding:0}
.panel-toggle span{display:block;width:40px;height:5px;border-radius:3px;background:#4a433c;margin:0 auto}
.panel{overflow:hidden;max-height:260px;transition:max-height .25s ease, opacity .2s}
#app.collapsed .panel{max-height:0;opacity:0}
#app.collapsed .controls{padding-top:6px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">필름캠</div>
    <div class="top-btns">
      <label class="pill hq" aria-label="기본 카메라로 고화질 촬영">
        <input id="nativeInput" type="file" accept="image/*" capture="environment" hidden>고화질
      </label>
      <button id="autoBtn" class="pill">자동밝기</button>
      <button id="timerBtn" class="pill" aria-label="타이머">타이머</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="view"></canvas>
    <button id="backBtn" class="back" hidden>✕ 카메라로</button>
    <div id="zoomBar" class="zoom-bar" hidden></div>
    <div id="filterName" class="filter-toast"></div>
    <div id="countdown" class="countdown"></div>
    <div id="flash" class="flash"></div>
    <div id="startScreen" class="start">
      <div class="start-card">
        <div class="start-title">필름캠</div>
        <p>필름처럼, 자연스럽게</p>
        <button id="startBtn" class="primary">카메라 켜기</button>
        <p class="sub">또는 위의 <b>고화질</b>로 기본 카메라 촬영 · 왼쪽 아래에서 사진 불러오기</p>
        <p id="startMsg" class="msg"></p>
      </div>
    </div>
  </main>

  <section class="controls">
    <button id="panelToggle" class="panel-toggle" aria-label="필름·조정 숨기기/보이기"><span></span></button>
    <div class="panel">
    <div id="adjTabs" class="adj-tabs">
      <button data-k="amount" class="active">필름</button>
      <button data-k="grain">노이즈</button>
      <button data-k="blur">블러</button>
      <button data-k="shadow">그림자</button>
      <button data-k="bright">밝기</button>
      <button data-k="contrast">대비</button>
      <button data-k="sat">채도</button>
      <button data-k="warm">색온도</button>
    </div>
    <div class="slider-row">
      <button id="adjReset" class="reset" aria-label="이 항목 기본값으로">↺</button>
      <input id="slider" type="range" min="0" max="100" value="100">
      <span id="sliderVal">100</span>
    </div>
    <div id="filters" class="filters"></div>
    </div>
    <div class="shutter-row">
      <label class="round" aria-label="사진 불러오기">
        <input id="fileInput" type="file" accept="image/*" hidden>
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
      </label>
      <button id="shutter" class="shutter" aria-label="촬영"><span></span></button>
      <button id="flipBtn" class="round" aria-label="카메라 전환">
        <svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 4v4h-4M20 15a8 8 0 0 1-14 3l-2-2M4 20v-4h4"/></svg>
      </button>
    </div>
  </section>
</div>

<div id="review" class="review" hidden>
  <img id="reviewImg" alt="찍은 사진">
  <p class="hint" id="reviewInfo"></p>
  <div class="review-actions">
    <button id="retakeBtn" class="ghost">돌아가기</button>
    <button id="saveBtn" class="primary">저장하기</button>
  </div>
</div>

<video id="video" playsinline muted autoplay></video>
<script>
// 필름캠: 필름 색감 프로필 + WebGL 렌더러
// 과한 효과 없이 "색만" 자연스럽게 바꾸는 것이 원칙.
// temp: +따뜻/-차가움, tint: +분홍/-초록, fade: 검정을 살짝 띄움(물빠진 느낌)
// redSat: 빨강 진하게, skyShift: 파랑을 청록으로, greenDeep/greenTeal: 초록을 깊게/청록으로
const FILTERS = [
  { id:'none', name:'원본', sw:['#9a9a9a','#5e5e5e'], p:{} },
  { id:'natural', name:'내추럴', sw:['#d9cbb8','#6f6355'],
    p:{ contrast:1.02, saturation:1.03, temp:.015 } },

  // 아그파 비스타 계열: 선명하고 따뜻한 빨강, 청록빛 하늘, 살짝 차가운 그림자
  { id:'agfa100', name:'아그파 100', sw:['#e2603f','#2f7f93'],
    p:{ exposure:.02, contrast:1.02, saturation:1.08, temp:.0, redSat:.1, skyShift:.2, greenDeep:.05,
        toneS:[.986,1.112,.888], toneM:[1.09,1.0,.9], toneH:[1.098,1.021,.874], fade:.055, fadeColor:[.9,1.0,.85] } },
  { id:'agfa200', name:'아그파 200', sw:['#e8854a','#3d6f86'],
    p:{ exposure:.03, contrast:1.0, saturation:1.0, redSat:.06, skyShift:.15,
        toneS:[.96,1.13,.91], toneM:[1.065,1.04,.89], toneH:[1.06,1.04,.89], fade:.045, fadeColor:[.92,1.0,.9] } },

  // 코니카 센츄리아 계열: 물빠진 색, 들뜬 검정, 차분한 청록·민트 기운 → 아련한 느낌
  { id:'konica', name:'코니카', sw:['#c9d3c8','#7d9a98'],
    p:{ exposure:.03, contrast:.96, saturation:.72, redSat:-.1, skyShift:.2, greenTeal:.12,
        toneS:[.89,1.03,1.08], toneM:[1.03,.995,.94], toneH:[1.02,1.045,.935], fade:.13, fadeColor:[.85,.97,1.0] } },

  // 후지 카메라(X-T30 II) 레시피: ASTIA/소프트(온화한 색상과 대비) 기반 + 6000K + WB 시프트 R+2 B+3 + 그림자 -0.5 + 그레인 약하게
  // 6000K: 일광(약 5500K)보다 살짝 따뜻하게 → R×1.04, B×0.955 / R+2 B+3 시프트 → R×1.03, B×1.045
  { id:'fujirecipe', name:'후지 레시피', sw:['#f4c9c0','#5f7f95'], grain:15,
    // 공유해 준 레시피 사진(빨간 체크·토마토·노란 모자) 실측: 중간톤만 살짝 따뜻한 분홍, 흰색·검정은 거의 중립
    p:{ toneS:[1.0,1.0,1.0], toneM:[1.045,.985,.97], toneH:[1.0,1.0,1.005], shadowTone:-0.5, contrast:.97, saturation:1.02, redSat:-.03 } },
  { id:'fuji2', name:'후지2', sw:['#f2d6d2','#4a5562'], grain:30,
    // 참고2 사진이 목표: 색은 빼지 않음(채도·빨강 그대로). 부드러운 그림자, 살짝 청회색으로 뜬 검정, 크림빛 하이라이트, 보통 입자
    p:{ toneS:[.98,1.0,1.03], toneM:[1.025,1.0,.975], toneH:[1.025,1.008,.96], contrast:1.0, saturation:1.0 } },
  { id:'fujimood', name:'후지 무드', sw:['#e0a27a','#2d4f57'], grain:25,
    // 공유해 준 사진(제복 입은 두 인형) 실측: 청록 그림자 + 따뜻한 하이라이트, 낮은 키
    p:{ toneS:[.86,1.07,1.07], toneM:[1.04,1.0,.955], toneH:[1.11,.99,.9], exposure:-.02, contrast:1.0, saturation:.95, fade:.02, fadeColor:[.85,.97,1.0] } },

  // 그 외 자연스러운 필름들
  { id:'portra', name:'포트라', sw:['#f0c9a8','#8a6d5c'],
    p:{ exposure:.03, contrast:.96, saturation:.92, temp:.05, tint:.015, redSat:-.05, skyShift:.1,
        shadowTint:[.48,.44,.42], shadowAmt:.1, highTint:[1,.95,.88], highAmt:.15, fade:.03 } },
  { id:'gold', name:'골드', sw:['#f2c14e','#9a5b2e'],
    p:{ contrast:1.01, saturation:1.05, temp:.13, tint:.01, redSat:.05, skyShift:.05, greenDeep:-.05,
        shadowTint:[.5,.42,.34], shadowAmt:.1, highTint:[1,.92,.74], highAmt:.22, fade:.025 } },
  { id:'fujic', name:'후지 C200', sw:['#b9d1b4','#3f6d63'],
    p:{ contrast:1.02, saturation:.92, temp:-.04, tint:-.03, redSat:-.05, skyShift:.2, greenTeal:.22, greenDeep:.12,
        shadowTint:[.36,.48,.46], shadowAmt:.18, highTint:[.98,1,.96], highAmt:.1, fade:.03 } },
  { id:'bw', name:'흑백', sw:['#e6e6e6','#262626'],
    p:{ bw:1, contrast:1.06, fade:.02 } },
];

const DEFAULTS = { exposure:0, contrast:1, saturation:1, temp:0, tint:0, fade:0,
  highTint:[1,1,1], highAmt:0, shadowTint:[.5,.5,.5], shadowAmt:0, bw:0,
  redSat:0, skyShift:0, greenDeep:0, greenTeal:0, fadeColor:[.92,.94,.95], toneS:[1,1,1], toneM:[1,1,1], toneH:[1,1,1], wbGain:[1,1,1], shadowTone:0 };

const VERT = `
attribute vec2 a_pos; varying vec2 v_uv;
void main(){ v_uv = a_pos*0.5+0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_pos,0.0,1.0); }`;

const FRAG = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_tex;
uniform vec4 u_crop; uniform float u_mirror; uniform float u_aspect;
uniform float u_amount, u_seed;
uniform float u_exposure,u_contrast,u_saturation,u_temp,u_tint,u_fade,u_bw,u_highAmt,u_shadowAmt;
uniform float u_redSat,u_skyShift,u_greenDeep,u_greenTeal;
uniform vec3 u_highTint,u_shadowTint,u_fadeColor,u_toneS,u_toneM,u_toneH;
uniform float u_autoGain; uniform vec3 u_wb;
uniform vec3 u_wbGain; uniform float u_shadowTone;
uniform float u_tBright,u_tContrast,u_tSat,u_tWarm,u_grain,u_blur,u_tShadow;

float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float luma(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
vec2 src(vec2 uv){ uv.x = mix(uv.x, 1.0-uv.x, u_mirror); return u_crop.xy + clamp(uv,0.0,1.0)*u_crop.zw; }
vec3 raw(vec2 uv){ return texture2D(u_tex, src(uv)).rgb; }

// 블러: 원판(보겔) 샘플링 + 픽셀마다 회전 → 렌즈 아웃포커스처럼 부드럽게
vec3 sampleImg(vec2 uv){
  if (u_blur < 0.002) return raw(uv);
  vec2 R = vec2(u_blur*0.009, u_blur*0.009*u_aspect);
  float rot = hash(floor(gl_FragCoord.xy) + 3.1) * 6.2832;
  vec3 acc = raw(uv);
  for (int i = 0; i < 24; i++) {
    float fi = float(i);
    float r = sqrt((fi + 0.5) / 24.0);
    float a = fi * 2.39996 + rot;
    acc += raw(uv + vec2(cos(a), sin(a)) * r * R);
  }
  return acc / 25.0;
}

// 밝기 곡선: 흰색은 그대로 두고 중간톤 위주로 올리거나 내림
// 그림자 부드럽게/단단하게: 밝기만 바꾸고 색 비율은 그대로 → 색이 빠지지 않음
vec3 shadowCurve(vec3 c, float s){
  float L = max(dot(c, vec3(0.299,0.587,0.114)), 1e-4);
  float w = 1.0 - smoothstep(0.12, 0.62, L);
  float L2 = mix(L, pow(L, 1.0 + s), w);
  return clamp(c * min(L2 / L, 4.0), 0.0, 1.0);
}
vec3 gainCurve(vec3 c, float g){ return c*g / (1.0 + (g-1.0)*c); }

float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  float a = hash(i + u_seed), b = hash(i + vec2(1.0,0.0) + u_seed);
  float c = hash(i + vec2(0.0,1.0) + u_seed), d = hash(i + vec2(1.0,1.0) + u_seed);
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}

void main(){
  vec2 uv = v_uv;
  // 자동 보정(조명 색, 어두운 장면 밝기)
  vec3 base = gainCurve(clamp(sampleImg(uv) * u_wb, 0.0, 1.0), u_autoGain);
  vec3 c = base;

  // ── 필름 색 ──
  c = clamp(c * u_wbGain, 0.0, 1.0);
  c = gainCurve(c, pow(2.0, u_exposure));
  c.r += u_temp*0.10; c.b -= u_temp*0.10; c.g += u_temp*0.015;
  c.r += u_tint*0.04; c.b += u_tint*0.04; c.g -= u_tint*0.05;
  c = clamp(c, 0.0, 1.0);

  // 색별 보정
  float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b));
  float chroma = mx - mn;
  float redness = clamp((c.r - max(c.g, c.b)) * 2.5, 0.0, 1.0);
  float blueness = clamp((c.b - max(c.r, c.g)) * 3.0, 0.0, 1.0);

class Renderer {
  constructor(canvas) {

      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;

    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);

    const loc = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);

  render(source, { crop = [0,0,1,1], mirror = false, params = {}, amount = 1, tweak = {}, width, height,

  $('stage').addEventListener('touchstart', e => {
    if (e.touches.length === 2 && state.mode === 'camera') {
      const [a, b] = e.touches;
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: state.zoom };
    }
  }, { passive: true });
  $('stage').addEventListener('touchmove', e => {
    if (pinch && e.touches.length === 2) {
      const [a, b] = e.touches;
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      setZoom(pinch.z * d / pinch.d);
      e.preventDefault();
    }
  }, { passive: false });
  $('stage').addEventListener('touchend', e => { if (e.touches.length === 0) setTimeout(() => { pinch = null; }, 0); });

  // 3:4 비율로 맞추기 (카메라가 4:3 그대로 주면 자르지 않음)
  function cameraCrop() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const portrait = vh >= vw, target = portrait ? 3 / 4 : 4 / 3;
    let w = vw, h = vh;
    if (vw / vh > target) w = vh * target; else h = vw / target;
    if (!state.zoomHW && state.zoom > 1) { w /= state.zoom; h /= state.zoom; }   // 디지털 줌: 가운데를 잘라냄
    return { crop: [(1 - w / vw) / 2, (1 - h / vh) / 2, w / vw, h / vh], w: Math.round(w), h: Math.round(h) };
  }

  let frame = 0;
  function loop() {
    if (state.mode === 'camera' && video.readyState >= 2 && video.videoWidth) {
      const { crop, w, h } = cameraCrop();
      if (state.autoOn && frame++ % 6 === 0) { try { smoothAuto(measure(video, video.videoWidth, video.videoHeight), 0.25); } catch {} }
      const [pw, ph] = fit(w, h, 1440);
      view.style.aspectRatio = `${pw}/${ph}`;
      renderer.render(video, { crop, mirror: state.facing === 'user', params: state.filter.p, amount: state.amount,
        tweak: state.tweak, width: pw, height: ph, auto: curAuto(), seed: state.seed });
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function setMode(m) {
    state.mode = m;
    $('shutter').classList.toggle('import', m === 'photo');
    $('shutter').setAttribute('aria-label', m === 'photo' ? '저장' : '촬영');
    $('backBtn').hidden = m !== 'photo';
    zoomBar.hidden = m !== 'camera';
  }

  // ── 사진: 앨범 불러오기 / 기본 카메라 고화질 촬영 ──
  async function openPhoto(file) {
    if (!file) return;
    try {
      const img = await loadImage(file);
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const [w, h] = fitFull(iw, ih);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      state.photo = { canvas: c, origW: iw, origH: ih };
      state.auto = measure(c, w, h);
      stopCamera();
      $('startScreen').hidden = true;
      setMode('photo');
      view.style.aspectRatio = `${w}/${h}`;
      photoUploaded = false;
      redraw();
    } catch (err) { alert('사진을 불러올 수 없어요'); }
  }
  $('fileInput').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; openPhoto(f); };
  $('nativeInput').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; openPhoto(f); };
  function loadImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(url), 1000); };
      img.onerror = rej; img.src = url;
    });
  }

  // 사진 미리보기: 화면용 크기로 줄인 사본을 한 번만 올리고, 조정할 때마다 다시 그림
  let photoUploaded = false, previewSrc = null, rafPending = false;
  function redraw() {
    if (state.mode !== 'photo' || !state.photo || rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      const p = state.photo.canvas;
      const [pw, ph] = fit(p.width, p.height, 1600);
      if (!photoUploaded) {
        previewSrc = document.createElement('canvas'); previewSrc.width = pw; previewSrc.height = ph;
        previewSrc.getContext('2d').drawImage(p, 0, 0, pw, ph);
      }
      renderer.render(previewSrc, { params: state.filter.p, amount: state.amount, tweak: state.tweak,
        width: pw, height: ph, auto: curAuto(), upload: !photoUploaded, seed: state.seed });
      photoUploaded = true;
    });
  }

  // ── 촬영 / 저장 ──
  $('shutter').onclick = async () => {
    if (state.busy) return;
    if (state.mode === 'camera' && !state.stream) { startCamera(); return; }
    state.busy = true;
    try {
      if (state.mode === 'camera' && state.timer) await countdown(state.timer);
      if (state.mode === 'camera') flash();
      await new Promise(r => setTimeout(r, 30));
      const out = await captureBlob();
      showReview(out);
    } catch (e) { alert('저장용 사진을 만들지 못했어요: ' + (e && e.message || e)); }
    finally { state.busy = false; }
  };
  function countdown(n) {
    return new Promise(res => {
      const el = $('countdown');
      const tick = () => { if (n === 0) { el.textContent = ''; res(); return; } el.textContent = n--; setTimeout(tick, 1000); };
      tick();
    });
  }
  function flash() { const f = $('flash'); f.classList.add('on'); requestAnimationFrame(() => setTimeout(() => f.classList.remove('on'), 60)); }

  function captureBlob() {
    if (!capRenderer) capRenderer = new Renderer(document.createElement('canvas'));
    let w, h, info;
    if (state.mode === 'camera') {
      const c = cameraCrop();
      [w, h] = fitFull(c.w, c.h);
      capRenderer.render(video, { crop: c.crop, mirror: state.facing === 'user', params: state.filter.p, amount: state.amount,
        tweak: state.tweak, width: w, height: h, auto: curAuto(), seed: state.seed });
      info = `${w}×${h} · 실시간 카메라` + (!state.zoomHW && state.zoom > 1 ? ` · 디지털 줌 ${state.zoom.toFixed(1)}×` : '');
    } else {
      const p = state.photo;
      w = p.canvas.width; h = p.canvas.height;
      capRenderer.render(p.canvas, { params: state.filter.p, amount: state.amount, tweak: state.tweak,
        width: w, height: h, auto: curAuto(), seed: state.seed });
      info = `${w}×${h}` + (w < p.origW ? ` (원본 ${p.origW}×${p.origH}, 브라우저 한도로 조정)` : ' · 원본 화소 그대로');
    }
    return new Promise((res, rej) => capRenderer.canvas.toBlob(b => b ? res({ blob: b, info }) : rej(new Error('메모리 부족')), 'image/jpeg', 0.95));
  }

  let currentBlob = null, currentUrl = null;
  function showReview({ blob, info }) {
    currentBlob = blob;
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(blob);
    $('reviewImg').src = currentUrl;
    $('reviewInfo').textContent = `${info} · ${blob.size >= 1e6 ? (blob.size / 1e6).toFixed(1) + "MB" : Math.round(blob.size / 1e3) + "KB"} · 사진을 꾹 눌러도 저장돼요`;
    $('review').hidden = false;
  }
  $('retakeBtn').onclick = () => { $('review').hidden = true; };
  $('saveBtn').onclick = async () => {
    if (!currentBlob) return;
    const d = new Date(), pad = (x) => String(x).padStart(2, '0');
    const name = `filmcam_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.jpg`;
    const file = new File([currentBlob], name, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) { /* 취소 */ }
    } else {
      const a = document.createElement('a'); a.href = currentUrl; a.download = name; a.click();
    }
  };

  if (store.get('camOk') === '1') startCamera();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
