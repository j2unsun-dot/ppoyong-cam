<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>뽀용캠</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="뽀용캠">
<meta name="theme-color" content="#1a1613">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">뽀용캠</div>
    <div class="top-btns"><button id="autoBtn" class="pill">자동밝기 켬</button>
    <button id="timerBtn" class="pill" aria-label="타이머">타이머 끔</button></div>
  </header>

  <main class="stage" id="stage">
    <canvas id="view"></canvas>
    <div id="filterName" class="filter-toast"></div>
    <div id="countdown" class="countdown"></div>
    <div id="flash" class="flash"></div>
    <div id="startScreen" class="start">
      <div class="start-card">
        <div class="start-title">뽀용캠</div>
        <p>햇살 같은 필터로 찍어보세요</p>
        <button id="startBtn" class="primary">카메라 켜기</button>
        <p id="startMsg" class="msg"></p>
      </div>
    </div>
  </main>

  <section class="controls">
    <div id="adjTabs" class="adj-tabs">
      <button data-k="amount" class="active">강도</button>
      <button data-k="bright">밝기</button>
      <button data-k="contrast">대비</button>
      <button data-k="sat">채도</button>
      <button data-k="warm">색온도</button>
    </div>
    <div class="slider-row">
      <button id="adjReset" class="reset" aria-label="이 항목 초기화">↺</button>
      <input id="slider" type="range" min="0" max="100" value="100">
      <span id="sliderVal">100</span>
    </div>
    <div id="filters" class="filters"></div>
    <div class="shutter-row">
      <label class="round" aria-label="사진 불러오기">
        <input id="fileInput" type="file" accept="image/*" hidden>
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
      </label>
      <button id="shutter" class="shutter" aria-label="촬영"><span></span></button>
      <button id="flipBtn" class="round" aria-label="카메라 전환">
        <svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 4v4h-4M20 15a8 8 0 0 1-14 3l-2-2M4 20v-4h4"/></svg>
      </button>
    </div>
  </section>
</div>

<div id="review" class="review" hidden>
  <img id="reviewImg" alt="찍은 사진">
  <p class="hint">사진을 꾹 눌러도 저장할 수 있어요</p>
  <div class="review-actions">
    <button id="retakeBtn" class="ghost">다시 찍기</button>
    <button id="saveBtn" class="primary">저장하기</button>
  </div>
</div>

<video id="video" playsinline muted autoplay></video>
<script src="filters.js"></script>
<script src="app.js"></script>
</body>
</html>
